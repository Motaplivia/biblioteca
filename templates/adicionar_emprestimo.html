{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header bg-primary bg-gradient text-white">
                    <h3 class="text-center mb-0">Novo Empréstimo</h3>
                </div>
                <div class="card-body p-4">
                    <form action="/emprestimos/adicionar" method="POST">
                        <div class="mb-4">
                            <label for="livro_id" class="form-label">Livro</label>
                            <select id="livro_id" name="livro_id" class="form-select" required>
                                <option value="">Selecione o livro</option>
                                {% for livro in livros %}
                                    <option value="{{ livro.id }}">{{ livro.titulo }} (ISBN: {{ livro.isbn }})</option>
                                {% endfor %}
                            </select>
                            <div class="form-text">Selecione o livro que será emprestado</div>
                        </div>

                        <div class="mb-4">
                            <label for="usuario_id" class="form-label">Usuário</label>
                            <select id="usuario_id" name="usuario_id" class="form-select" required>
                                <option value="">Selecione o usuário</option>
                                {% for usuario in usuarios %}
                                    <option value="{{ usuario.id }}">{{ usuario.nome }} ({{ usuario.email }})</option>
                                {% endfor %}
                            </select>
                            <div class="form-text">Selecione o usuário que realizará o empréstimo</div>
                        </div>

                        <div class="mb-4">
                            <label for="data_devolucao_prevista" class="form-label">Data de Devolução Prevista</label>
                            <input type="date" id="data_devolucao_prevista" name="data_devolucao_prevista" 
                                   class="form-control" required
                                   min="{{ hoje }}"
                                   value="{{ data_padrao }}">
                            <div class="form-text">A data de devolução deve ser posterior à data atual</div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="/emprestimos" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-2"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-check me-2"></i>Registrar Empréstimo
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
